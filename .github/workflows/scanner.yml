name: Trader AI scanner

# GitHub's timer is unreliable for every-5-minute jobs, so one run stays up for the whole trading day
# and scans every 5 minutes by itself. Before GitHub's 6-hour limit it starts its own replacement.
# The hourly starts are backups: if a run is already going they wait; if none is, they start one.
on:
  schedule:
    - cron: "25 13-20 * * 1-5"      # hourly on weekdays from before the open (times are UTC)
    - cron: "20,50 * * * *"         # twice an hour all day: picks up your phone commands (bought / sold)
  workflow_dispatch: {}             # "Run workflow" by hand starts a full-day scan

permissions:
  contents: read
  actions: write                    # lets a run start its own replacement

concurrency:
  group: trader-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - name: Restore what the scanner remembers (your stocks, sent alerts, learning)
        uses: actions/cache/restore@v4
        with:
          path: trader_data
          key: trader-data-${{ github.run_id }}
          restore-keys: trader-data-
      - name: Scan
        run: python cloud_runner.py ${{ github.event.schedule == '20,50 * * * *' && '--once' || '--loop' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCOUNT: ${{ vars.ACCOUNT }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          TIMEFRAME: ${{ vars.TIMEFRAME }}
          CHECKS_PER_SCAN: ${{ vars.CHECKS_PER_SCAN }}
          FRACTIONAL: ${{ vars.FRACTIONAL }}
      - name: Save what the scanner remembers
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trader_data
          key: trader-data-${{ github.run_id }}
